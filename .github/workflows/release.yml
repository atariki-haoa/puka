name: Release

# Fires on every push to main -- which covers both direct commits to main and
# PRs merged into main, since a PR merge (any strategy: merge commit, squash,
# or rebase) *is* a push to main. There is deliberately no separate
# `pull_request` trigger: adding one would double-fire this workflow for
# every merged PR (it'd also match the `push` it produces).
#
# The bump type is read from the message of the commit that landed on main:
#   fix/...  or patch/...    -> patch
#   feature/... or minor/... -> minor
#   major/...                -> major
# For a squash-merged PR that message is the PR title (GitHub's default
# squash commit message). For a "create a merge commit" PR it's
# "Merge pull request #N from owner/branch\n\n<PR title>" -- every line of
# the message is checked, and a leading "Merge pull request #N from owner/"
# is stripped before matching, so either the PR title or a like-prefixed
# branch name (e.g. `feature/foo`) is enough. Commits that match none of the
# prefixes (the common case) are left alone -- no bump, no release.
#
# workflow_dispatch is kept as a manual escape hatch: run it by hand to force
# a specific bump, or leave it on "auto" to reuse the same detection above.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to bump (or "auto" to detect from the last commit message)
        required: true
        type: choice
        default: auto
        options:
          - auto
          - major
          - minor
          - patch

permissions:
  contents: write

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine bump and compute next version
        id: version
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.bump }}" != "auto" ]; then
            bump="${{ inputs.bump }}"
            echo "==> Manual override: $bump"
          else
            message="$(git log -1 --pretty=%B)"
            bump=""
            while IFS= read -r line; do
              stripped="$(sed -E 's|^Merge pull request #[0-9]+ from [^/]+/||' <<< "$line")"
              stripped_lc="$(tr '[:upper:]' '[:lower:]' <<< "$stripped")"
              case "$stripped_lc" in
                fix/*|patch/*) bump=patch; break ;;
                feature/*|minor/*) bump=minor; break ;;
                major/*) bump=major; break ;;
              esac
            done <<< "$message"

            if [ -z "$bump" ]; then
              echo "No fix/, patch/, feature/, minor/, or major/ prefix found in the commit message -- skipping release."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "==> Detected bump from commit message: $bump"
          fi

          current="$(grep -oP '(?<=project\(puka VERSION )[0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt)"
          IFS='.' read -r major minor patch <<< "$current"
          case "$bump" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          next="${major}.${minor}.${patch}"
          echo "==> $current -> $next ($bump)"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "next=$next" >> "$GITHUB_OUTPUT"

      - name: Bump CMakeLists.txt
        if: steps.version.outputs.skip != 'true'
        run: |
          set -euo pipefail
          sed -i \
            "s/project(puka VERSION [0-9]\+\.[0-9]\+\.[0-9]\+/project(puka VERSION ${{ steps.version.outputs.next }}/" \
            CMakeLists.txt
          grep -q "project(puka VERSION ${{ steps.version.outputs.next }} " CMakeLists.txt

      - name: Commit and tag
        if: steps.version.outputs.skip != 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "Bump version to ${{ steps.version.outputs.next }} [skip ci]"
          git tag "v${{ steps.version.outputs.next }}"
          git push origin "HEAD:${{ github.ref }}"
          git push origin "v${{ steps.version.outputs.next }}"

      - name: Create GitHub Release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.next }}" \
            --title "v${{ steps.version.outputs.next }}" \
            --generate-notes
